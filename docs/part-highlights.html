<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ganorabricks LEGO parts listed at $10 and up, with photos and links to the BrickLink and BrickOwl lots.">
    <title>Ganorabricks — Parts $10+</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WQS0X98RMY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WQS0X98RMY');
    </script>
</head>
<body>

<div id="navbar"></div>

<section class="page-intro">
    <h1 class="section-title">Parts $10 and up</h1>
    <p>These are the for-sale lots at $10 and up. The price is the BrickLink price. Open the lot on BrickLink or BrickOwl to buy it, or look at the photos here first.</p>
    <p>Everything else is in the stores: <a class="text-link" href="https://store.bricklink.com/Ganorabricks#/shop" target="_blank" rel="noopener noreferrer">BrickLink</a> and <a class="text-link" href="https://ganorabricks.brickowl.com/" target="_blank" rel="noopener noreferrer">BrickOwl</a>.</p>
</section>

<section>
    <h2 class="section-title">Photo highlights</h2>
    <div id="highlights"></div>
</section>

<div id="footer"></div>

<script src="script.js"></script>
<script>
fetch("highlights.json")
    .then(response => {
        if (!response.ok) throw new Error("missing highlights");
        return response.json();
    })
    .then(data => renderHighlights("highlights", data.items || []))
    .catch(() => renderHighlights("highlights", []));
loadSiteChrome();
</script>
</body>
</html>
